[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/USTC-XeF2/alloy"
authors = ["XeF2 <contact@xef2.top>"]
license = "MIT"

[workspace]
members = [
    "crates/alloy",
    "crates/alloy-adapters/*",
    "crates/alloy-core",
    "crates/alloy-framework",
    "crates/alloy-macros",
    "crates/alloy-runtime",
    "crates/alloy-transport",
    "examples/storage",
    "examples/echo_bot",
]
resolver = "2"

[workspace.dependencies]
alloy-core = { version = "0.1.0", path = "crates/alloy-core" }
alloy-framework = { version = "0.1.0", path = "crates/alloy-framework" }
alloy-macros = { version = "0.1.0", path = "crates/alloy-macros" }
alloy-runtime = { version = "0.1.0", path = "crates/alloy-runtime" }
alloy-transport = { version = "0.1.0", path = "crates/alloy-transport" }

async-trait = "0.1.89"
bytes = "1.11.1"
derive_more = "2.1.1"
futures = "0.3.32"
parking_lot = "0.12.5"
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = "1.52.1"
tracing = "0.1.44"

[profile.release]
strip = true
lto = true
codegen-units = 1

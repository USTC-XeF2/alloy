[package]
name = "alloy-runtime"
version = { workspace = true }
description = "Runtime orchestration layer for the Alloy bot framework"
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[features]
default = []

# Command system
command = ["alloy-framework/command"]

# Config format features
toml-config = ["figment/toml"]
yaml-config = ["figment/yaml"]
dotenv-config = ["dep:dotenvy"]

# Logging features
json-log = ["tracing-subscriber/json"]

[dependencies]
alloy-core = { workspace = true }
alloy-framework = { workspace = true }
dotenvy = { version = "0.15.7", optional = true }
figment = { version = "0.10.19", features = ["env"] }
futures = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "signal"] }
tracing = { workspace = true }
tracing-appender = "0.2.4"
tracing-subscriber = "0.3.23"

[package]
name = "amira-framework"
version = { workspace = true }
description = "High-level framework components for the Amira bot framework"
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[features]
default = []

command = ["dep:clap", "dep:shlex"]

[dependencies]
amira-core = { workspace = true }
derive_more = { workspace = true, features = ["as_ref", "deref", "display"] }
futures = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shlex = { version = "1.3.0", optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tower = { version = "0.5.3", features = ["filter", "util"] }
tower-layer = "0.3.3"
tracing = { workspace = true }

[dependencies.clap]
version = "4.6.1"
default-features = false
features = ["derive", "error-context", "help", "std", "usage"]
optional = true

[dev-dependencies]
tokio-test = "0.4.5"

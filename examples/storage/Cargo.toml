[package]
name = "alloy-plugin-storage"
version = "0.1.0"
edition = "2024"
authors = ["XeF2 <contact@xef2.top>"]
license = "MPL-2.0"
description = "A file-storage plugin for the Alloy bot framework"

[dependencies]
alloy = { path = "../../crates/alloy", default-features = false }
derive_more = { version = "2.1.1", features = ["as_ref", "deref"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.51.1", features = ["fs"] }

[package]
name = "echo-bot"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A simple echo bot example for the Amira framework"
publish = false

[dependencies]
amira = { path = "../../crates/amira", features = ["ws-server"] }
amira-adapter-onebot = { path = "../../adapters/onebot" }
amira-plugin-storage = { path = "../../examples/plugin-storage" }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.52.1", features = ["fs", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
